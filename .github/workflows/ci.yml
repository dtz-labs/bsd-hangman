name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_LANGUAGES: pl en es ca lt sk cs pt

jobs:
  host-tests:
    name: host tests and translation checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Run host tests
        run: make host-test check-translations

  build-taps:
    name: build all 16 TAPs
    runs-on: ubuntu-latest
    needs: host-tests
    steps:
      - uses: actions/checkout@v5

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Generate dictionaries and locales
        run: make prepare

      - name: Compile every language in official z88dk
        run: >-
          docker run --rm -v "$PWD":/src -w /src z88dk/z88dk:latest
          make tapes

      - name: Validate dictionaries and memory layouts
        run: make test layout

      - name: Require exactly 16 tapes
        run: test "$(find build -type f -name 'hangman-*.tap' | wc -l)" -eq 16

      - name: Upload TAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: bsd-hangman-taps
          path: build/*/hangman-*.tap
          if-no-files-found: error
