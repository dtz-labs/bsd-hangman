name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  BUILD_LANGUAGES: pl en es ca lt sk cs pt

jobs:
  release:
    name: build and publish all TAPs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install gettext
        run: sudo apt-get update && sudo apt-get install -y gettext

      - name: Generate dictionaries and locales
        run: make prepare

      - name: Compile every language in official z88dk
        run: >-
          docker run --rm -v "$PWD":/src -w /src z88dk/z88dk:latest
          make tapes

      - name: Validate tests, dictionaries, and layouts
        run: make test layout

      - name: Package all 16 TAPs
        run: |
          set -euo pipefail
          mapfile -t tap_files < <(find build -type f -name 'hangman-*.tap' | sort)
          test "${#tap_files[@]}" -eq 16
          package="dist/bsd-hangman-${GITHUB_REF_NAME}"
          mkdir -p "${package}/taps" "${package}/data"
          cp "${tap_files[@]}" "${package}/taps/"
          cp LICENSE THIRD_PARTY.md "${package}/"
          cp -R LICENSES "${package}/"
          cp data/README.md data/LICENSE-GPL-3.0.txt "${package}/data/"
          (cd dist && zip -r "bsd-hangman-${GITHUB_REF_NAME}-taps.zip" \
            "bsd-hangman-${GITHUB_REF_NAME}")
          (cd "${package}/taps" && sha256sum hangman-*.tap) > dist/SHA256SUMS
          unzip -l "dist/bsd-hangman-${GITHUB_REF_NAME}-taps.zip"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mapfile -t tap_files < <(find build -type f -name 'hangman-*.tap' | sort)
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" \
              "${tap_files[@]}" dist/*.zip dist/SHA256SUMS THIRD_PARTY.md \
              --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              "${tap_files[@]}" dist/*.zip dist/SHA256SUMS THIRD_PARTY.md \
              --repo "${GITHUB_REPOSITORY}" \
              --title "BSD Hangman ${GITHUB_REF_NAME}" \
              --notes "ZX Spectrum BSD Hangman: eight languages, each for 48K and 128K. Word-list attribution and licences are included in THIRD_PARTY.md." \
              --verify-tag
          fi
